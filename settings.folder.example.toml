# Manual-folder example. Copy this file to the settings_path from config.toml,
# then replace directory with an existing ABSOLUTE path outside queue_dir.

[queue]
# Refill up to this length. This is not a maximum; uploads may exceed it.
target_length = 10
# Maximum size of one complete upload request (25 MiB here).
max_upload_bytes = 26214400
# "drop_and_refill" removes the previous queue copy and finds a new candidate.
# Use "rotate" to move the previous photo to the back of the existing queue.
advance_behavior = "drop_and_refill"

[history]
# Distinct compositions recently promoted to current. 0 disables and clears history.
# Favorites are retained independently of this limit.
max_entries = 100

[rendering]
# Compatibility default is direct_jpeg. Use server_dither_bmp to send a
# ready-to-display six-color BMP and avoid on-frame dithering.
target = "paper_7" # or "paper_l"
output_mode = "server_dither_bmp"

[advancement]
# Options: "manual", "scheduled", or "every_fetch".
type = "every_fetch"

[advancement.settings]
# Only these direct client IPs advance after a completed frame GET.
# Empty means every direct client, including browsers, will qualify.
frame_client_ips = ["192.168.1.50"]

# Exactly one supplier is currently supported. Keep its ID stable so imported
# history remains associated with the same supplier.
[[suppliers]]
id = "primary"
type = "manual_folder"

[suppliers.settings]
# Top-level supported raster images are discovered alphabetically. No recursion.
directory = "/absolute/path/to/source-images"
poll_interval_seconds = 60
