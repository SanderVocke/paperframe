<script>
// Capture clicked button's name/value before disabling controls. Native form
// submission otherwise drops the insertion-position submitter.
document.addEventListener('submit',event=>{
  const form=event.target;
  if(event.defaultPrevented)return;
  if(form.dataset.pending){event.preventDefault();return;}
  form.dataset.pending='true';
  const button=event.submitter;
  if(button&&button.name){
    const input=document.createElement('input');input.type='hidden';input.name=button.name;input.value=button.value;
    input.dataset.pendingSubmitter='true';form.append(input);
  }
  form.querySelectorAll('button').forEach(button=>{
    button.dataset.pendingDisabled=String(button.disabled);button.disabled=true;
  });
});
window.addEventListener('pageshow',()=>{
  document.querySelectorAll('form[data-pending]').forEach(form=>{
    delete form.dataset.pending;
    form.querySelectorAll('[data-pending-submitter]').forEach(input=>input.remove());
    form.querySelectorAll('button[data-pending-disabled]').forEach(button=>{
      button.disabled=button.dataset.pendingDisabled==='true';delete button.dataset.pendingDisabled;
    });
  });
});
</script>
