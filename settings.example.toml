# DigiKam example. Copy this file to the settings_path from config.toml and
# replace every example path. The database and photo roots should be read-only.

[queue]
# Refill up to this length. This is not a maximum; uploads may exceed it.
target_length = 10
# Maximum size of one complete upload request (25 MiB here).
max_upload_bytes = 26214400

[rendering]
target = "paper_7" # or "paper_l"
output_mode = "server_dither_bmp" # or "direct_jpeg"

[advancement]
type = "scheduled"

[advancement.settings]
# IANA timezone and unique local 24-hour HH:MM times.
timezone = "Europe/Amsterdam"
times = ["03:00", "15:00"]

# Exactly one supplier is currently supported. Keep its ID stable so imported
# history remains associated with the same supplier.
[[suppliers]]
id = "primary"
type = "digikam_sqlite"

[suppliers.settings]
database_path = "/catalog/digikam4.db"
max_candidates = 50000
# ORDER BY is the queue supply order. The four aliases below are required.
query = """
SELECT
    Images.id AS image_id,
    AlbumRoots.specificPath AS root_path,
    Albums.relativePath AS album_path,
    Images.name AS file_name
FROM Images
JOIN Albums ON Albums.id = Images.album
JOIN AlbumRoots ON AlbumRoots.id = Albums.albumRoot
WHERE lower(Images.name) LIKE '%.jpg'
   OR lower(Images.name) LIKE '%.jpeg'
   OR lower(Images.name) LIKE '%.png'
   OR lower(Images.name) LIKE '%.webp'
ORDER BY Images.id
"""

# database_root must exactly match root_path returned by the query.
# mounted_root is where that same library is visible to this process.
[[suppliers.settings.path_mappings]]
database_root = "/home/user/Pictures"
mounted_root = "/photos"
