[package]
name = "paperframe-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
askama = "0.14"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
futures-util = "0.3"
httpdate = "1.0"
image = { version = "=0.25.6", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlparser = "0.59"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
serde_urlencoded = "0.7"
tempfile = "3.0"
tower = { version = "0.5", features = ["util"] }
